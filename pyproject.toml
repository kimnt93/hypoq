[project]
name = "hypoq"
version = "0.1.0"
description = "Autonomous AI quantitative research lab and empirical modeling platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "requests>=2.31.0",
    "yfinance>=0.2.30",
    "sentence-transformers>=2.2.0",
    "psycopg[binary]>=3.1.0",
]

[tool.uv]
package = false
